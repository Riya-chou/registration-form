<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuva Youth Ki Awaz - Registration Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        p {
            text-align: center;
            color: #7f8c8d;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 600;
        }
        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus, select:focus {
            border-color: #3498db;
            outline: none;
        }
        .checkbox-group {
            margin-top: 10px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            font-weight: normal;
            margin-bottom: 10px;
            cursor: pointer;
            color: #555;
        }
        .checkbox-label input {
            margin-right: 10px;
            transform: scale(1.2);
        }
        button[type="submit"] {
            width: 100%;
            background-color: #2ecc71;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button[type="submit"]:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Yuva Youth Ki Awaz</h2>
    <p>Join the community and voice your thoughts</p>
    
    <form action="#" method="POST">
        <!-- Name Field -->
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>

        <!-- Email Field -->
        <div class="form-group">
            <label for="email">Email ID</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>

        <!-- Primary Interest Dropdown -->
        <div class="form-group">
            <label for="primary-interest">Primary Area of Interest</label>
            <select id="primary-interest" name="primary_interest" required>
                <option value="" disabled selected>-- Select an option --</option>
                <option value="editing">Editing</option>
                <option value="media">Media</option>
                <option value="content-creation">Content Creation</option>
                <option value="journalism">Journalism & Reporting</option>
                <option value="social-work">Social Work / Activism</option>
                <option value="other">Other</option>
            </select>
        </div>

        <!-- Multiple Choice Interests -->
        <div class="form-group">
            <label>Select All Topics You Wish to Explore:</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="skills[]" value="video-editing"> Video/Audio Editing
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="skills[]" value="digital-media"> Digital Media Marketing
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="skills[]" value="writing"> Article & Script Writing
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="skills[]" value="photography"> Photography & Videography
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="skills[]" value="podcasting"> Podcasting & Public Speaking
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="skills[]" value="graphic-design"> Graphic Designing
                </label>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit">Submit Registration</button>
    </form>
</div>

</body>
</html>
